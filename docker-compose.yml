version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ddmrp-db
    environment:
      POSTGRES_USER: ddmrp_user
      POSTGRES_PASSWORD: ddmrp_password
      POSTGRES_DB: ddmrp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ddmrp-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ddmrp_user:ddmrp_password@db/ddmrp_db
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - ./resources_ext:/app/resources_ext

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ddmrp-frontend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
