version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ddmrp-db
    environment:
      POSTGRES_USER: ddmrp_user
      POSTGRES_PASSWORD: ddmrp_password
      POSTGRES_DB: ddmrp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ddmrp-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ddmrp_user:ddmrp_password@db/ddmrp_db
      # Browser origin(s) allowed to call the API (not the API hostname)
      - CORS_ORIGINS=http://localhost:3001,https://transtrack-ddmrp.skom.my.id
      # Nightly refresh all SKU at 01:00
      - NIGHTLY_REFRESH_ENABLED=1
      - NIGHTLY_REFRESH_HOUR=1
      - NIGHTLY_REFRESH_MINUTE=0
      - NIGHTLY_SL_TARGET=0.95
      - NIGHTLY_POP_SIZE=24
      - NIGHTLY_N_GEN=40
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - ./resources_ext:/app/resources_ext

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://transtrack-ddmrp-api.skom.my.id
    container_name: ddmrp-frontend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    depends_on:
      - backend

volumes:
  postgres_data:
